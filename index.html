<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI 이후의 인생게임 — 노동의 가치 발표용 인생 시뮬레이션. 38세부터 눈을 감는 날까지, 선택할 때마다 자아실현·생산성·도덕·관계 게이지가 움직입니다.">
<meta property="og:title" content="AI 이후의 인생게임">
<meta property="og:description" content="(전) 무직백수의 살아남기 시즌 2 — 노동의 가치 인생게임">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>AI 이후의 인생게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Pen+Script&display=swap">
<style>
  /* 레이아웃: 1in8b 발표 템플릿 — 다크 종이 위에 HUD(나이·연표·4색 상태막대) + 중대 결정 카드(모노 레이블, 큰 세리프 질문, 번호 선택지) + 라이트 종이 추모관 */
  :root {
    --paper: #0D1316; --card: #141D21; --card2: #1A2428; --rule: #2A383D;
    --ink: #E1E9E6; --ink2: #A3B2AF; --ink3: #8A9A96;
    --accent: #E2678A; --accent-soft: #3A1C26;
    --good: #5CC38B; --gold: #D9AF59; --stamp: #4CC0AF; --bad: #F07B6B; --warn: #E2B04C;
    --grid-lo: #25283F; --grid-mid: #2A8A80; --grid-hi: #B8E8A8;
    --mem-paper: #F1EADF; --mem-card: #FBF8F2; --mem-rule: #D9D0C0; --mem-ink: #13212A; --mem-ink2: #4A5A61; --mem-accent: #C25C7A; --mem-accent-soft: #F3E3E8; --shelf: #C49A6C; --shelf2: #9E764C;
    --g-self: var(--gold); --g-prod: var(--stamp); --g-moral: var(--good); --g-bond: var(--accent);
    --display: "Hahmlet", "Noto Serif KR", Cambria, serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", "Courier New", ui-monospace, monospace;
    --pen: "Nanum Pen Script", cursive;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --paper: #F1EADF; --card: #FBF8F2; --card2: #F4EEE4; --rule: #D9D0C0;
      --ink: #13212A; --ink2: #4A5A61; --ink3: #6B7A80;
      --accent: #C25C7A; --accent-soft: #F3E3E8;
      --good: #2F9A62; --gold: #B8892F; --stamp: #1F9A8A; --bad: #D1584A; --warn: #B88A2A;
      --grid-lo: #DAD2C3; --grid-mid: #5FB3A9; --grid-hi: #8FD39A;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --paper: #F1EADF; --card: #FBF8F2; --card2: #F4EEE4; --rule: #D9D0C0;
    --ink: #13212A; --ink2: #4A5A61; --ink3: #6B7A80;
    --accent: #C25C7A; --accent-soft: #F3E3E8;
    --good: #2F9A62; --gold: #B8892F; --stamp: #1F9A8A; --bad: #D1584A; --warn: #B88A2A;
    --grid-lo: #DAD2C3; --grid-mid: #5FB3A9; --grid-hi: #8FD39A;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.65; display: flex; flex-direction: column; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; }
  .mono { font-family: var(--mono); }
  .k { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
  .k b { color: var(--accent); font-weight: 500; }

  /* ---------- HUD ---------- */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
    padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hud-in { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 8px 28px; align-items: center; }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand .t { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--ink2); white-space: nowrap; }
  .brand .t em { color: var(--accent); font-style: normal; }
  .age { font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .age b { font-size: 46px; font-weight: 500; }
  .age span { font-size: 14px; color: var(--ink3); }
  .age .yr { margin-left: 8px; }
  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; border-left: 1px solid var(--rule); padding-left: 14px; }
  .money small { font-size: 11px; letter-spacing: .1em; color: var(--ink3); }
  .money b { font-size: 20px; font-weight: 500; color: var(--gold); }
  .money .delta { font-size: 12px; min-width: 0; }
  .money .delta.up { color: var(--good); } .money .delta.down { color: var(--bad); }
  .tl { position: relative; height: 28px; min-width: 0; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 11px; height: 3px; background: var(--rule); }
  .tl .done { position: absolute; left: 0; top: 11px; height: 3px; background: var(--accent); width: 0%; transition: width .5s ease; }
  .tl .tick { position: absolute; top: 7px; width: 2px; height: 11px; background: var(--rule); transform: translateX(-1px); }
  .tl .tick::after { content: attr(data-age); position: absolute; top: 13px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--ink3); }
  .tl .me { position: absolute; top: 4px; width: 17px; height: 17px; background: var(--accent); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--accent); transform: translateX(-8px); transition: left .5s ease; }
  .tl .pill { position: absolute; right: 0; top: -22px; font-family: var(--mono); font-size: 11px; color: var(--ink3); background: var(--card2); border: 1px solid var(--rule); padding: 1px 8px; }
  .gauges { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .gauge { min-width: 0; }
  .gauge .lab { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .gauge .lab span { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink2); }
  .gauge .bar { height: 7px; background: var(--rule); }
  .gauge .bar i { display: block; height: 100%; width: 0; transition: width .5s ease; }
  .gauge.self .bar i { background: var(--g-self); } .gauge.prod .bar i { background: var(--g-prod); } .gauge.moral .bar i { background: var(--g-moral); } .gauge.bond .bar i { background: var(--g-bond); }
  .gauge .delta { font-family: var(--mono); font-size: 12px; min-height: 16px; margin-top: 2px; }
  .gauge .delta.up { color: var(--good); } .gauge .delta.down { color: var(--bad); }

  /* ---------- 무대 ---------- */
  .stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding-block: 26px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card { width: 100%; max-width: 880px; min-width: 0; background: var(--card); border: 1px solid var(--rule); }
  .card-in { padding: clamp(20px, 3.6vw, 36px); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px clamp(20px, 3.6vw, 36px); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  h1, h2 { font-family: var(--display); text-wrap: balance; margin: 6px 0 8px; line-height: 1.25; font-weight: 700; }
  h1 { font-size: clamp(34px, 5vw, 56px); }
  h2 { font-size: clamp(26px, 3.4vw, 36px); }
  .lede { color: var(--ink2); margin: 0 0 16px; }
  .story { font-size: clamp(18px, 2vw, 21px); line-height: 1.75; max-width: 36em; }
  .story p { margin: 0 0 .9em; } .story p:last-child { margin-bottom: 0; }
  .story q { quotes: "“" "”"; color: var(--ink); }
  .story .ai { font-family: var(--mono); font-size: .86em; background: var(--card2); border: 1px solid var(--rule); padding: 1px 7px; }
  .ref { font-family: var(--mono); font-size: 12.5px; color: var(--stamp); background: var(--card2); border: 1px solid var(--rule); padding: 8px 12px; margin-top: 18px; }
  .ref b { color: var(--ink3); font-weight: 500; margin-right: 8px; }

  .pause { margin: 22px 0 4px; padding: 16px 20px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
  .pause p { margin: 6px 0 0; font-family: var(--display); font-size: clamp(19px, 2.2vw, 24px); line-height: 1.5; text-wrap: balance; font-weight: 500; }

  .choices { display: grid; gap: 10px; margin-top: 22px; }
  .choice { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; text-align: left; background: var(--card2); border: 1px solid var(--rule); padding: 14px 18px; cursor: pointer; font-size: clamp(17px, 1.9vw, 20px); line-height: 1.5; transition: border-color .12s, background .12s; }
  .choice:hover, .choice:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
  .choice .n { font-family: var(--mono); font-size: 14px; color: var(--ink3); margin-top: 3px; }
  .choice .fx { display: block; margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--ink3); }
  .choice .fx.hidden { visibility: hidden; }
  .track { height: 3px; background: var(--rule); margin-top: 20px; }
  .track i { display: block; height: 100%; background: var(--accent); }
  .track-note { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-top: 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .track-note button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink3); text-decoration: underline; font-family: var(--mono); font-size: 12px; }

  .next { margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .btn { background: var(--card2); color: var(--ink); border: 1px solid var(--rule); padding: 11px 20px; cursor: pointer; font-size: 16px; font-weight: 500; }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.wide { flex: 1; text-align: center; }
  .hint { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-top: 16px; }

  /* ---------- 표지 ---------- */
  .cover { position: relative; }
  .cover .big { font-family: var(--display); font-size: clamp(44px, 8vw, 88px); line-height: 1.08; margin: 10px 0 14px; letter-spacing: -.01em; font-weight: 800; }
  .cover .big em { color: var(--accent); font-style: normal; }
  .cover .sprites { position: absolute; right: 0; top: 0; display: flex; align-items: flex-end; gap: 6px; }
  .cover .sprites .person { width: 48px; } .cover .sprites .heart { width: 32px; margin-bottom: 72px; margin-right: -26px; } .cover .sprites .dog { width: 56px; }
  .counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin: 22px 0 10px; }
  .counter b { display: block; font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 700; }
  .counter b.pink { color: var(--accent); }
  .counter span { font-size: 13px; color: var(--ink2); }
  .topic { display: inline-flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .topic .badge { background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 11px; padding: 3px 9px; border: 1px solid var(--accent); }
  .topic span { font-size: 14px; color: var(--ink2); }

  /* ---------- 인사 기록 카드 ---------- */
  .regi { border: 1px solid var(--rule); background: var(--card2); }
  .regi .head { background: var(--accent); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; gap: 12px; flex-wrap: wrap; }
  .regi .head b { font-family: var(--display); font-size: 17px; font-weight: 700; }
  .regi .head .no { font-family: var(--mono); font-size: 12px; opacity: .9; }
  .regi .body { padding: 18px 20px 22px; }
  .regi .name { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .regi .name input { background: transparent; border: 0; border-bottom: 1px dashed var(--rule); color: var(--ink); font-family: var(--display); font-size: clamp(30px, 4vw, 42px); font-weight: 700; width: 7ch; padding: 0; }
  .regi .name input:focus { outline: none; border-bottom-color: var(--accent); }
  .regi .name small { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
  .regi .desc { color: var(--ink2); font-size: 14.5px; margin: 6px 0 14px; max-width: 46em; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .grid3 div small { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink3); letter-spacing: .06em; }
  .grid3 div b { font-weight: 600; font-size: 16px; }
  .regi .person { position: absolute; right: 24px; top: 70px; width: 36px; }

  /* ---------- 인생 기록 (연표) ---------- */
  .rec { display: grid; }
  .rec .row { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .rec .row:first-child { border-top: 0; }
  .rec .y { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink3); padding-top: 3px; font-size: 14px; }
  .rec .row b { display: block; font-weight: 600; font-size: 17px; }
  .rec .row .v { font-family: var(--mono); font-size: 12px; color: var(--stamp); margin-top: 3px; }
  .rec .row.now b { color: var(--accent); }
  .rec .row .t { color: var(--ink2); }

  /* ---------- 엔딩 레이아웃 ---------- */
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 20px; }
  .panel { background: var(--card2); border: 1px solid var(--rule); padding: 18px 20px; min-width: 0; }
  .panel h3 { font-family: var(--display); font-size: 18px; margin: 0 0 4px; font-weight: 700; }
  .panel .sub { font-family: var(--mono); font-size: 11.5px; color: var(--ink3); margin-bottom: 12px; }
  .kv { display: grid; gap: 8px; font-size: 14px; }
  .kv div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--rule); padding-bottom: 6px; }
  .kv div span:first-child { color: var(--ink3); }
  .kv div span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 20px; }
  .tile { background: var(--card2); border: 1px solid var(--rule); padding: 16px 18px; }
  .tile b { display: block; font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 700; }
  .tile b.pink { color: var(--accent); } .tile b.teal { color: var(--stamp); } .tile b.gold { color: var(--gold); font-size: 26px; }
  .tile span { font-size: 12.5px; color: var(--ink2); }
  .chart { width: 100%; max-width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; margin-top: 6px; color: var(--ink2); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .legend .self::before { background: var(--g-self); } .legend .prod::before { background: var(--g-prod); } .legend .moral::before { background: var(--g-moral); } .legend .bond::before { background: var(--g-bond); }

  /* 인생 지도 */
  .map { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
  .map .cell { aspect-ratio: 1; max-width: 100%; background: var(--grid-lo); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--paper); position: relative; }
  .map .cell.s0 { background: var(--grid-lo); color: var(--ink3); } .map .cell.s1 { background: var(--grid-mid); } .map .cell.s2 { background: var(--grid-hi); } .map .cell.s3 { background: var(--warn); } .map .cell.s4 { background: var(--ink3); } .map .cell.sd { background: var(--bad); }
  .map .cell.now { outline: 2px solid var(--accent); outline-offset: -2px; }
  .map-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-top: 10px; }
  .map-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
  .map-legend .s0::before { background: var(--grid-lo); } .map-legend .s1::before { background: var(--grid-mid); } .map-legend .s2::before { background: var(--grid-hi); } .map-legend .s3::before { background: var(--warn); } .map-legend .s4::before { background: var(--ink3); } .map-legend .sd::before { background: var(--bad); }
  .map-keys { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-top: 6px; }

  /* 추모관 (라이트 종이) */
  .memorial { background: var(--mem-paper); color: var(--mem-ink); border: 1px solid var(--mem-rule); padding: 20px; margin-top: 22px; }
  .memorial .k { color: var(--mem-ink2); }
  .mem-grid { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
  .mem-card { background: var(--mem-card); border: 1px solid var(--mem-rule); padding: 10px; }
  .mem-card img { width: 100%; display: block; }
  .mem-card b { display: block; font-family: var(--display); font-size: 18px; margin-top: 10px; color: var(--mem-ink); }
  .mem-card small { font-family: var(--mono); font-size: 11.5px; color: var(--mem-ink2); display: block; }
  .mem-card p { margin: 6px 0 0; font-size: 13.5px; color: var(--mem-ink2); }
  .mem-card .funeral { width: 100%; height: auto; display: block; border: 1px solid var(--mem-rule); }
  .fkv { display: grid; gap: 5px; margin-top: 10px; font-size: 12.5px; border-top: 1px solid var(--mem-rule); padding-top: 8px; }
  .fkv div { display: flex; justify-content: space-between; gap: 8px; }
  .fkv div span:first-child { color: var(--mem-ink2); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; }
  .fkv div span:last-child { text-align: right; color: var(--mem-ink); font-variant-numeric: tabular-nums; }
  .memorial .story .fline { color: var(--mem-ink2); font-size: .92em; border-top: 1px dashed var(--mem-rule); padding-top: 10px; margin-top: 12px; }
  .memorial img.scene { width: 180px; max-width: 100%; margin-top: 14px; border: 1px solid var(--mem-rule); }
  .epitaph { font-family: var(--pen); font-size: clamp(26px, 3vw, 34px); line-height: 1.35; color: var(--mem-ink); margin: 0 0 8px; }
  .ending-title { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); font-weight: 800; color: var(--mem-accent); margin: 0 0 6px; line-height: 1.15; }
  .memorial .story { color: var(--mem-ink); font-size: clamp(16px, 1.8vw, 19px); }
  .memorial .story q { color: var(--mem-ink); }
  .candles { background: #2B2420; margin-top: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .candles .row { display: flex; gap: 8px; align-items: flex-end; flex: 1; }
  .candles img { width: 14px; }
  .candles span { font-size: 13px; color: #CDBFB0; }
  .candles button { background: var(--mem-accent); color: #fff; border: 0; padding: 8px 16px; cursor: pointer; font-size: 14px; }

  /* 마무리 질문 */
  .cta { background: var(--mem-paper); color: var(--mem-ink); border: 1px solid var(--mem-rule); padding: 30px 24px; text-align: center; margin-top: 22px; }
  .cta h2 { font-size: clamp(22px, 3vw, 32px); margin: 0 0 6px; color: var(--mem-ink); }
  .cta p { color: var(--mem-ink2); margin: 0 0 18px; font-size: 15px; }
  .cta .btn.accent { background: var(--mem-accent); border-color: var(--mem-accent); }
  .cta .btn { color: var(--mem-ink); border-color: var(--mem-rule); background: var(--mem-card); }
  .cta .btn.accent { color: #fff; }
  .cta .next { justify-content: center; }

혼자 걷기가 어려워졌다. 아이들이 모여 상의하는 소리가 거실에서 들린다.
이제 슬슬 간병을 받아야 할 나이가 다가오기 시작함을 느끼고 있다. 
AI 간병을 받아야 할까? 아니면 간병인을 고용할까?
선택 =
1. AI 간병으로 한다. 누구한테도 짐이 되기는 싫다. | 생산성 +1, 관계 -2, 재산 -2000 | 다음 n11
2. 간병인을 고용한다. 혼자 있으면 적적하다. | 관계 +3, 재산 -6000 | 다음 n11
3. 둘 다 미룬다. 손은 아직 움직인다. 될 때까지 혼자 한다. 고집은 늙지 않는다. | 자아실현 +2, 도덕 +1 | 다음 n11

@엔딩 관계 | 병실에 사람이 너무 많아서 간호사가 두 번이나 주의를 줬다. 후배, 제자, 식구들. 나는 그저 웃고 있었다.
@엔딩 자아실현 | 병실 창가에 내가 깎은 나무 블록들과 수많은 감사패들이 놓여 있다. 손이, 귀가 기억하는 것들. 아무도 모르지만, 나는 안다. 그걸로 됐다.
@엔딩 도덕 | 장문의 문자가 매년 오지만, 올해는 이상하게도 유독 많은 사람들에게 고맙다는 이야기를 들었다. 상은 못 받았지만 서류는 남았다. 몇몇 사람들이 내 병상에 와 흐느끼기 시작했다.
@엔딩 생산성 | 조용했다. 잔고가 넉넉해서 1인실이었다. 벽걸이 화면이 "괜찮으신가요" 하고 물었다. 나는 대답하지 않았다. 대답할 사람이 없기도 했고.
@엔딩 동점 | 뭐가 남았는지 끝내 세지 못했다. 그래도 괜찮았다. 세는 건 남은 사람들 몫이다.

본문 =
더는 출근하지 않는다. 그런데 전화가 온다. 후배가, 제자가, 식구가. "이거 어떻게 생각하세요?"
AI는 언제나 나보다 빨리, 그리고 정확하게 답을 냈다. 그래도 사람들은 굳이 나한테 물었다.
내 노동이 남긴 건 수율이나 생산성이 아니라고 생각한다. 굳이 따지자면 나를 찾아오는 사람들이 아닐까? 이정도면 완전 잘 살았지.

본문 =
끝까지 손으로, 귀로 해보는 사람으로 남았다. 효율로는 AI한테 매번 졌다. 한 번도 못 이겼다.
그런데 왜 되는지, 왜 안 되는지를 몸으로 아는 사람은 나뿐이었다.
일이 나한테 준 건 돈이 아니라(돈도 좀 주긴 했지만), 내가 누구인지 아는 감각이었다.

내가 남긴 건 수동 승인 한 건, 라인을 세운 사유서 한 장, 고쳐 쓴 보고서 한 통이었다. 아무도 상을 주지 않았다. 고과는 늘 낮았다.
하지만 절대로 속으로 불편하거나 힘들지는 않았다.
내가 소신을 가지고 내 스스로에 떳떳했기 때문에!

아이는 아직도 내가 무슨 일을 했는지 모른다. 나도 설명할 말을 못 찾았다.

    for (const c of n.choices) if (c.next !== "END" && !nodes[c.next]) errs.push(`[노드 ${n.id}]: "다음 ${c.next}" — 그런 노드가 없음`);
  }
  for (const e of Object.values(endings)) {
    e.title = e["제목"] || e.key; e.cond = e["조건"] || ""; e.pic = e["그림"] || "l1"; e.epitaph = e["묘비"] || ""; e.text = e.text.map(rich);
    if (!SPR[e.pic]) errs.push(`[엔딩 ${e.key}]: 그림 "${e.pic}" 없음 (l1~l4, room)`);
  }
  for (const k of ["self", "prod", "moral", "bond", "tie"]) if (!endings[k]) errs.push(`엔딩 [엔딩 ${{ self: "자아실현", prod: "생산성", moral: "도덕", bond: "관계", tie: "동점" }[k]}]이 없음`);
  const startNode = cfg["시작노드"] || "n1";
  if (!nodes[startNode]) errs.push(`시작 노드 "${startNode}"이 없음 ([설정] 시작노드 확인)`);
  return { cfg, prologue, nodes, endings, errs, startNode };
}

function applyScenario(d) {
  CFG = d.cfg; PROLOGUE = d.prologue; NODES = d.nodes; ENDINGS = d.endings;
  START_MONEY = parseInt(CFG["시작재산"] || 0, 10); USE_MONEY = ("시작재산" in CFG) || Object.values(d.nodes).some(n => n.choices.some(c => "money" in c.fx));
  GMAX = Math.max(1, parseInt(CFG["게이지최대"] || 10, 10)); BIRTH = parseInt(CFG["출생년도"] || 1999, 10); AGE_MIN = parseInt(CFG["시작나이"] || 35, 10); AGE_MAX = parseInt(CFG["연표끝"] || 85, 10);
  START = { self: 3, prod: 2, moral: 4, bond: 1 };
  const sg = parseFx(CFG["시작게이지"] || "", [], "시작게이지"); for (const k in sg) START[k] = sg[k];
  CFG.deathBase = parseFloat(CFG["사망기본"] || 77); CFG.deathMul = parseFloat(CFG["사망관계배수"] || 0.6); CFG.deathMax = parseFloat(CFG["사망최대추가"] || 6);
  CFG.startNode = d.startNode;
  CFG.map = (CFG["지도"] || "27:s0:休, 28:s1:알, 30:s1:취, 34:s1:거, 35:s3:AI, 38:s2, 60:s4:퇴").split(/[,，]/).map(s => s.trim().split(":")).map(p => ({ a: parseInt(p[0], 10), s: p[1] || "s0", ch: p[2] || "" })).filter(p => !isNaN(p.a)).sort((x, y) => x.a - y.a);
  // 가장 긴 결정 경로 길이 (진행 막대용)
  const depth = (id, seen) => { if (id === "END" || !NODES[id] || seen.has(id)) return 0; seen.add(id); let m = 0; for (const c of NODES[id].choices) m = Math.max(m, depth(c.next, new Set(seen))); return 1 + m; };
  MAXDEPTH = Math.max(1, depth(CFG.startNode, new Set()));
}
function deathAge(g) { return Math.round(CFG.deathBase + Math.min(CFG.deathMax, g.bond * CFG.deathMul)); }
function stageOf(age) {
  let st = { s: "s0", ch: "" }, mark = "";
  for (const p of CFG.map) { if (age >= p.a) { st = p; mark = age === p.a ? p.ch : ""; } }
  return [st.s, mark];
}

/* ---------- 시나리오 불러오기 ---------- */
let SRC = { kind: "내장", name: "" };
async function loadScenario() {
  let text = null;
  try { const imp = localStorage.getItem("lifegame2-scn"); if (imp) { const o = JSON.parse(imp); text = o.text; SRC = { kind: "가져온 파일", name: o.name || "" }; } } catch (e) {}
  if (text == null) {
    for (const f of SCENARIO_FILES) {
      try { const r = await fetch(encodeURI(f), { cache: "no-store" }); if (r.ok) { text = await r.text(); SRC = { kind: "파일", name: f }; break; } } catch (e) {}
    }
  }
  if (text == null) { text = document.getElementById("scn").textContent; SRC = { kind: "내장", name: "" }; }
  return text;
}
function useText(text) {
  const d = parseScenario(text);
  applyScenario(d); SRC.errs = d.errs;
  return d.errs;
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try { localStorage.setItem("lifegame2-scn", JSON.stringify({ name: file.name, text: rd.result })); } catch (e) {}
    SRC = { kind: "가져온 파일", name: file.name }; useText(rd.result); S = fresh(); hud.hidden = true; render(); save();
  };
  rd.readAsText(file, "utf-8");
}
function resetScenario() {
  try { localStorage.removeItem("lifegame2-scn"); } catch (e) {}
  loadScenario().then(t => { useText(t); S = fresh(); hud.hidden = true; render(); save(); });
}

function wealthTier(m) {
  const cuts = (CFG["재산구간"] || "5000, 15000, 30000").split(/[,，]/).map(s => parseInt(s, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
  let t = 0; for (const c of cuts) if (m >= c) t++; return Math.min(3, t);
}
function bondLevel(b) {
  const cuts = (CFG["조문구간"] || "6, 12").split(/[,，]/).map(s => parseInt(s, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
  let t = 0; for (const c of cuts) if (b >= c) t++; return Math.min(2, t);
}
function funeralInfo() {
  const tier = USE_MONEY ? wealthTier(S.money || 0) : 1, bl = bondLevel(S.g.bond);
  const F = FUNERAL_DEFAULT, names = F.tiers;

  const guests = Math.round(S.g.bond * 5 + tier * 3 + 2);

}
/* 픽셀풍 장례식장 그림 — 벽·제단은 재산, 조문객 수는 관계 */
function funeralSVG(f) {
  const W = 240, H = 150, tier = f.tier;
  const wall = ["#3C3A3A", "#8F857A", "#B48A6A", "#E9E3D5"][tier], wall2 = ["#302E2E", "#7A7066", "#9B6E4E", "#CFC3AC"][tier];
  const floor = ["#2A2626", "#5C5247", "#6B4A32", "#B9A98E"][tier];
  const px = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  let s = `<svg class="funeral" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="장례식장">`;
  s += px(0, 0, W, 110, wall) + px(0, 110, W, 40, floor);
  for (let x = 0; x < W; x += 24) s += px(x, 0, 2, 110, wall2); // 벽 패널
  if (tier === 3) { // 샹들리에 + 금테
    s += px(0, 0, W, 4, "#D9AF59") + px(0, 106, W, 4, "#D9AF59");
    s += px(118, 4, 4, 14, "#D9AF59") + px(104, 18, 32, 4, "#D9AF59");
    for (const x of [104, 112, 120, 128, 132]) s += px(x, 22, 4, 6, "#FFF1B8");
  }
  if (tier === 0) s += px(170, 14, 54, 18, "#555") + `<text x="197" y="27" font-size="8" text-anchor="middle" font-family="IBM Plex Mono, monospace" fill="#CFCFCF">B1 소실</text>`;
  // 제단
  const altarW = [60, 80, 100, 120][tier], ax = (W - altarW) / 2;
  s += px(ax, 86, altarW, 24, ["#4A4040", "#6B5B4E", "#8B5A2B", "#F3EEE4"][tier]);
  if (tier >= 2) s += px(ax, 86, altarW, 3, "#D9AF59");
  // 국화
  const mums = [3, 8, 16, 26][tier];
  for (let i = 0; i < mums; i++) { const x = ax + 4 + (i * (altarW - 8)) / Math.max(1, mums - 1), y = 80 + ((i % 3) * 3); s += px(x - 2, y, 4, 4, "#F6F2E6") + px(x - 1, y + 1, 2, 2, "#E2B04C"); }
  // 영정
  const fw = 30, fh = 38, fx = (W - fw) / 2, fy = 44;
  s += px(fx - 3, fy - 3, fw + 6, fh + 6, "#1A1A1A") + px(fx, fy, fw, fh, "#F1EADF");
  s += `<image href="${SPR.person}" xlink:href="${SPR.person}" x="${fx + 6}" y="${fy + 4}" width="18" height="30" style="image-rendering:pixelated"/>`;
  s += px(fx - 3, fy + fh + 3, fw + 6, 3, "#1A1A1A") + px(fx + 2, fy - 7, 26, 4, "#1A1A1A"); // 검은 리본
  // 촛불 2
  for (const cx of [fx - 16, fx + fw + 10]) s += `<image href="${SPR.candleOn}" xlink:href="${SPR.candleOn}" x="${cx}" y="70" width="8" height="16" style="image-rendering:pixelated"/>`;
  // 화환
  const wr = f.wreath;
  for (let i = 0; i < wr; i++) {
    const side = i % 2 === 0 ? -1 : 1, k = Math.floor(i / 2), col = Math.floor(k / 2), row = k % 2;
    const x = W / 2 + side * (altarW / 2 + 14 + col * 20) - 8, y = row === 0 ? 68 : 56;
    s += px(x, y, 16, 16, "#2F6B45") + px(x + 4, y + 4, 8, 8, "#F6F2E6") + px(x + 6, y + 6, 4, 4, "#E2B04C") + px(x + 6, y + 16, 4, 20, "#7A4E8C") + px(x + 5, y + 20, 6, 10, "#F6F2E6");
  }
  // 조문객
  const guests = Math.min(11, Math.round(S.g.bond / 2) + f.tier - 1);
  for (let i = 0; i < Math.max(0, guests); i++) { const x = 12 + i * 20 + (i % 2) * 4, y = 112 + (i % 2) * 8; s += `<image href="${SPR.person}" xlink:href="${SPR.person}" x="${x}" y="${y}" width="14" height="24" style="image-rendering:pixelated"/>`; }
  if (guests <= 1) s += `<text x="${W - 8}" y="142" font-size="8" text-anchor="end" font-family="IBM Plex Mono, monospace" fill="${tier >= 2 ? "#7A6A50" : "#9A9A9A"}">방명록 1쪽</text>`;
  return s + `</svg>`;
}

  for (let a = AGE_MIN; a <= AGE_MAX; a += 10) {
    const t = document.createElement("div"); t.className = "tick"; t.dataset.age = a;
    t.style.left = ((a - AGE_MIN) / (AGE_MAX - AGE_MIN) * 100) + "%"; tl.appendChild(t);
  }
  $("#gauges").innerHTML = Object.keys(GAUGES).map(k => `
    <div class="gauge ${k}"><div class="lab"><b>${GAUGES[k]}</b><span id="v-${k}">0</span></div><div class="bar"><i id="b-${k}"></i></div><div class="delta" id="d-${k}"></div></div>`).join("");
  updateHud();
}
function setAge(a) {
  $("#ageNum").textContent = a; $("#yearNum").textContent = "· " + yearOf(a) + "년";
  const pct = Math.max(0, Math.min(100, (a - AGE_MIN) / (AGE_MAX - AGE_MIN) * 100));
  $("#tlMe").style.left = pct + "%"; $("#tlDone").style.width = pct + "%";
}
function updateHud(delta = {}) {
  setAge(S.age);
  const n = S.screen === "node" ? NODES[S.node] : null;
  $("#pill").textContent = n ? n.ch + (S.path ? " · " + S.path : "") : "삶의 기록";
  const mb = $("#money"); mb.hidden = !USE_MONEY;
  if (USE_MONEY) { $("#moneyNum").textContent = fmtMoney(S.money || 0); const dm = delta.money || 0, el = $("#moneyDelta"); el.textContent = dm ? (dm > 0 ? "+" : "−") + fmtMoney(Math.abs(dm)) : ""; el.className = "delta " + (dm > 0 ? "up" : dm < 0 ? "down" : ""); }
  for (const k of Object.keys(GAUGES)) {
    $("#v-" + k).textContent = S.g[k]; $("#b-" + k).style.width = (S.g[k] / GMAX * 100) + "%";
    const d = delta[k] || 0, el = $("#d-" + k);
    el.textContent = d ? (d > 0 ? "+" + d : "" + d) : ""; el.className = "delta " + (d > 0 ? "up" : d < 0 ? "down" : "");
  }
}
let flowTimer = null;
function flowAge(from, to) {
  if (flowTimer) { clearInterval(flowTimer); flowTimer = null; }
  if (to <= from || matchMedia("(prefers-reduced-motion: reduce)").matches) { setAge(to); return; }
  const step = Math.max(60, Math.min(220, 1400 / (to - from))); let a = from;
  flowTimer = setInterval(() => { a++; setAge(a); if (a >= to) { clearInterval(flowTimer); flowTimer = null; } }, step);
}
function fxText(fx) { const p = Object.entries(fx).map(([k, v]) => k === "money" ? `재산 ${v > 0 ? "+" : "−"}${fmtMoney(Math.abs(v))}` : `${GAUGES[k]} ${v > 0 ? "+" : ""}${v}`); return p.length ? p.join(" · ") : "—"; }
function progress() { return Math.min(100, Math.round(S.log.length / MAXDEPTH * 100)); }

/* ---------- 중대 결정 카드 ---------- */
function renderNode(delta) {
  const n = NODES[S.node], age = nodeAge(n);
  hud.hidden = false; updateHud(delta || {});
  card.innerHTML = `
    <div class="modal-head"><span class="k"><b>중대 결정</b> · ${esc(n.ch)}</span><span class="k">${age}세 · ${yearOf(age)}년${S.path ? " · " + esc(S.path) : ""}</span></div>
    <div class="card-in">
      <h2>${esc(n.title)}</h2>
      <div class="story">${nodeText(n).map(p => `<p>${p}</p>`).join("")}</div>
      ${n.ref ? `<div class="ref"><b>자료</b>${n.ref}</div>` : ""}
      ${n.pause ? `<div class="pause"><div class="k"><b>잠시 멈춤</b> · 여러분이라면?</div><p>${rich(n.pause)}</p></div>` : ""}
      <div class="choices">${n.choices.map((c, i) => `
        <button class="choice" data-i="${i}"><span class="n">${i + 1}</span><span>${c.t}<span class="fx ${S.showFx ? "" : "hidden"}">${fxText(c.fx)}</span></span></button>`).join("")}</div>
      <div class="track"><i style="width:${progress()}%"></i></div>
      <div class="track-note"><span>${S.log.length}번째 선택 앞 · 숫자키로 고르세요</span><span><button id="toggleFx">게이지 변화 ${S.showFx ? "숨기기" : "보기"}</button> · <button id="mapLink">엔딩 지도</button> · <button id="restart">처음부터</button></span></div>
    </div>`;
  card.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.i));
  $("#toggleFx").onclick = () => { S.showFx = !S.showFx; render(); };
  $("#mapLink").onclick = showMap; $("#restart").onclick = restart;
}

function choose(i) {
  const n = NODES[S.node], c = n.choices[i], prevAge = S.age, age = nodeAge(n);
  for (const [k, v] of Object.entries(c.fx)) { if (k === "money") S.money = (S.money || 0) + v; else S.g[k] = Math.max(0, Math.min(GMAX, S.g[k] + v)); }
  if (c.flag) S.flags.push(c.flag);
  if (c.path) S.path = c.path;
  S.log.push({ age, title: n.title, choice: c.t.replace(/<[^>]+>/g, "") });
  S.hist.push({ age, g: { ...S.g } });
  if (c.next === "END" || !NODES[c.next]) { S.screen = "end"; render(); save(); return; }
  if (NODES[c.next].age === "death") S.death = deathAge(S.g);
  S.node = c.next; S.age = nodeAge(NODES[c.next]);
  render(c.fx); flowAge(prevAge, S.age); save();
}

/* ---------- 엔딩 · 추모관 ---------- */
function renderEnd() {
  const key = pickEnding(), e = ENDINGS[key] || ENDINGS.tie, d = S.death || deathAge(S.g), nm = nameOr();
  const f = funeralInfo();
  if (flowTimer) { clearInterval(flowTimer); flowTimer = null; }
  hud.hidden = false; S.age = d; updateHud();
  const first = PROLOGUE[0] ? PROLOGUE[0].a : AGE_MIN;
  const years = []; for (let a = first; a <= d; a++) years.push(a);
  const evt = {}; S.log.forEach(l => { evt[l.age] = 1; });
  const cells = years.map(a => { const [s, ch] = a === d ? ["sd", "†"] : stageOf(a); return `<div class="cell ${s}" title="${a}세 · ${yearOf(a)}년">${evt[a] && s !== "sd" ? "★" : ch}</div>`; }).join("");
  card.innerHTML = `
    <div class="modal-head"><span class="k"><b>엔딩</b> · ${esc(e.cond)}</span><span class="k">${d}세 · ${yearOf(d)}년 · ${esc(nm)}</span></div>
    <div class="card-in">
      <div class="memorial">
        <div class="k">추모관 · 한 사람의 일</div>
        <div class="mem-grid">
          <div class="mem-card">${funeralSVG(f)}<b>${esc(nm)}</b><small>${BIRTH} – ${yearOf(d)} · 향년 ${d}세</small><p>${esc(e.epitaph)}</p>
            <div class="fkv"><div><span>빈소</span><span>${esc(f.hall)}</span></div><div><span>조화</span><span>${f.wreath ? f.wreath + "개" : "없음"}</span></div><div><span>부고</span><span>${f.notices}명에게</span></div><div><span>조문객</span><span>${f.guests}명</span></div>${USE_MONEY ? `<div><span>남긴 재산</span><span>${fmtMoney(S.money || 0)}원 · ${esc(f.name)}</span></div>` : ""}</div>
          </div>
          <div><div class="ending-title">${esc(e.title)}</div><p class="epitaph">${esc(e.epitaph)}</p><div class="story">${e.text.map(p => `<p>${p}</p>`).join("")}<p class="fline">${esc(f.tierLine)} ${esc(f.bondLine)}</p></div><img class="px scene" src="${SPR[e.pic] || SPR.l1}" alt=""></div>
        </div>
        <div class="candles"><div class="row" id="candleRow"></div><span id="candleMsg"></span><button id="candleBtn">촛불 켜기</button></div>
      </div>
      <div class="tiles">
        <div class="tile"><b>${S.log.length}</b><span>번의 중대 결정</span></div>
        <div class="tile"><b class="teal">${d - AGE_MIN}</b><span>AI 이후에 산 햇수</span></div>
        <div class="tile"><b class="pink">${key === "tie" ? "동점" : GAUGES[key]}</b><span>${key === "tie" ? "최고 게이지 동점" : "가장 높이 쌓인 가치"}</span></div>
        ${USE_MONEY ? `<div class="tile"><b class="gold">${fmtMoney(S.money || 0)}</b><span>남긴 재산 (만원 단위)</span></div>` : ""}
      </div>
      <div class="two">
        <div class="panel"><h3>인생 지도</h3><div class="sub">한 칸 = 1년 · ${first}세부터 ${d}세까지 · ★ 중대 결정</div>
          <div class="map">${cells}</div>
          <div class="map-legend"><span class="s0">무직</span><span class="s1">일하는 시기</span><span class="s3">AI 도입</span><span class="s2">AI 이후 경로${S.path ? " · " + esc(S.path) : ""}</span><span class="s4">퇴직 이후</span><span class="sd">마지막</span></div>
          <div class="map-keys">${esc(CFG["지도범례"] || "")}</div>
        </div>
        <div class="panel"><h3>남긴 것</h3><div class="sub">마지막 게이지</div>
          <div class="kv">${Object.keys(GAUGES).map(k => `<div><span>${GAUGES[k]}</span><span>${S.g[k]} / ${GMAX}</span></div>`).join("")}${USE_MONEY ? `<div><span>재산</span><span>${fmtMoney(S.money || 0)}원</span></div>` : ""}
            <div><span>경로</span><span>${esc(S.path || "—")}</span></div><div><span>기록</span><span>${esc(S.flags.length ? S.flags.join(", ") : "—")}</span></div></div>
        </div>
      </div>
      <div class="panel" style="margin-top:18px"><h3>게이지 변화</h3><div class="sub">${AGE_MIN}세부터 ${d}세까지 · 네 가지 가치</div>${chartSVG()}
        <div class="legend"><span class="self">자아실현</span><span class="prod">생산성</span><span class="moral">도덕</span><span class="bond">관계</span></div></div>
      <div class="panel" style="margin-top:18px"><h3>인생 기록 · 선택</h3><div class="sub">연표 · 결정 순서대로</div>
        <div class="rec">${S.log.map(l => `<div class="row"><div class="y">${l.age}세</div><div><span class="t">${esc(l.title)} — </span>${esc(l.choice)}</div></div>`).join("")}</div></div>
      <div class="cta">
        <h2>${esc(CFG["마지막질문"] || "")}</h2><p>${esc(CFG["마지막부제"] || "")}</p>
        <div class="next"><button class="btn" id="mapLink">엔딩 지도</button><button class="btn accent" id="again">다시 살기</button></div>
        <div class="deco"><img class="px" src="${SPR.tree}" alt=""><img class="px h" src="${SPR.house}" alt=""><img class="px p" src="${SPR.person}" alt=""><img class="px" src="${SPR.dog}" alt=""></div>
      </div>
    </div>`;
  $("#again").onclick = restart; $("#mapLink").onclick = showMap;
  drawCandles(); $("#candleBtn").onclick = () => { S.candles = Math.min(8, S.candles + 1); drawCandles(); save(); };
}
function drawCandles() {
  $("#candleRow").innerHTML = Array.from({ length: 8 }, (_, i) => `<img class="px" src="${i < S.candles ? SPR.candleOn : SPR.candleOff}" alt="">`).join("");
  $("#candleMsg").textContent = S.candles ? `${S.candles}명이 촛불을 켜 두었어요.` : "누군가 촛불을 켜 두었어요.";
}
function chartSVG() {
  const W = 720, H = 220, L = 36, R = 16, T = 14, B = 30, pts = S.hist, n = pts.length;
  const x = i => L + (n > 1 ? i / (n - 1) : 0) * (W - L - R), y = v => T + (1 - v / GMAX) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="게이지 변화 그래프">`;
  for (const v of [0, GMAX / 2, GMAX]) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink3)">${v}</text>`;
  pts.forEach((p, i) => { s += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink3)">${p.age}</text>`; });
  for (const k of Object.keys(GAUGES)) {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.g[k]).toFixed(1)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="var(--g-${k})" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<circle cx="${x(n - 1)}" cy="${y(pts[n - 1].g[k])}" r="4" fill="var(--g-${k})" stroke="var(--card2)" stroke-width="2"/>`;
  }
  return s + `</svg>`;
}

function showMap() {
  if (document.querySelector(".overlay")) return;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="panel">
    <div class="k"><b>엔딩 지도</b> · ${Object.keys(ENDINGS).length}갈래</div>
    <h2 style="margin-top:4px">마지막에 가장 높이 쌓인 가치가 엔딩을 정합니다</h2>
    <p class="lede">동점이면 ‘동점’ 엔딩으로 갑니다. 사망 나이는 ${CFG.deathBase} + 관계×${CFG.deathMul} (최대 +${CFG.deathMax}) → ${Math.round(CFG.deathBase)}~${Math.round(CFG.deathBase + CFG.deathMax)}세. 노드 ${Object.keys(NODES).length}개, 가장 긴 결정 경로 ${MAXDEPTH}단계.</p>
    <div class="emap">${Object.entries(ENDINGS).map(([k, e]) => `<div class="e ${k}"><b>${esc(e.title)}</b><small>${esc(e.cond)} · ${esc(e.epitaph)}</small></div>`).join("")}</div>
    <div class="next"><button class="btn" id="closeMap">닫기</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector("#closeMap").onclick = close; ov.addEventListener("click", e => { if (e.target === ov) close(); });
}
function restart() { S = fresh(); hud.hidden = true; render(); save(); }

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const ov = document.querySelector(".overlay");
  if (e.key === "Escape" && ov) { ov.remove(); return; }
  if (e.key === "m" || e.key === "M") { ov ? ov.remove() : showMap(); return; }
  if (e.key === "r" || e.key === "R") { restart(); return; }
  if (S.screen === "node" && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (NODES[S.node].choices[i]) choose(i); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (S.screen === "cover") { S.screen = "regi"; render(); }
    else if (S.screen === "regi") { S.screen = "prologue"; S.pro = 0; render(); }
    else if (S.screen === "prologue") { if (S.pro >= PROLOGUE.length - 1) startGame(); else { S.pro++; render(); } }
    else if (S.screen === "node" && NODES[S.node].choices.length === 1) choose(0);
  }
});
/* 시나리오.txt 끌어다 놓기 */
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drop"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drop"));
document.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); const f = e.dataTransfer.files[0]; if (f) importFile(f); });

function start(data) {
  S = (data && data.S) ? data.S : fresh();
  if (S.screen === "node" && !NODES[S.node]) S = fresh();
  const hudOn = S.screen === "node" || S.screen === "end";
  if (hudOn) buildHud();
  hud.hidden = !hudOn;
  render();
}
loadScenario().then(t => {
  useText(t);
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
});

</script>
</body>
</html>
